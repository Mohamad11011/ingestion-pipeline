[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workplace-relations-scraper"
version = "0.1.0"
description = "Workplace Relations decisions ingestion and transformation pipeline"
requires-python = ">=3.11"
dependencies = [
    "scrapy>=2.11",
    "pymongo>=4.8",
    "boto3>=1.35",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]
orchestration = [
    "dagster>=1.8",
    "dagster-webserver>=1.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scrapy_project", "orchestration"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# sys.path bootstrap so Scrapy and Dagster can import the shared src package.
"scrapy_project/workplace_scraper/settings.py" = ["E402"]
